services:
  database:
    image: "docker.io/postgres:18-alpine"
    env_file:
      - .env
    volumes:
      - db-data:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U backend -d drinks"]
      interval: 1s
      retries: 10
      start_period: 10s
      timeout: 30s

  backend:
    image: "ghcr.io/metalab/metadrinks:backend-latest" #can also be used with backend-<tag> or backend-pr-<number>
    ports:
      - 8080:8080
    env_file:
      - .env
    depends_on:
      database:
        condition: service_healthy
        restart: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/v1/ready | grep -q '\"status\":\"ok\"' || exit 1"]
      interval: 60s
      retries: 5
      start_period: 10s
      timeout: 30s

  frontend:
    image: "ghcr.io/metalab/metadrinks:frontend-latest" #can also be used with backend-<tag> or backend-pr-<number>
    ports:
      - 3000:3000
    env_file:
      - .env
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db-data: